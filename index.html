<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <link rel="canonical" href="https://ideam.sergiobc.com/" />
    <!-- Vista previa al compartir el enlace (WhatsApp, LinkedIn, X, Slack). La
         imagen es una captura real de la portada, 1200x630, el tamano que esas
         plataformas recortan para la tarjeta grande. Al ser una SPA sin
         renderizado en servidor, todas las rutas comparten esta tarjeta. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Datos hídricos del IDEAM" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:url" content="https://ideam.sergiobc.com/" />
    <meta property="og:title" content="Automatización de datos hídricos del IDEAM" />
    <meta property="og:description" content="De millones de registros crudos a datos limpios, curvas IDF y una plataforma viva. Trabajo de grado de Ingeniería Civil, Universidad de la Costa." />
    <meta property="og:image" content="https://ideam.sergiobc.com/og-ideam.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Portada de la plataforma: Automatización de datos hídricos del IDEAM, con los logos de la Universidad de la Costa y del IDEAM." />

    <meta name="twitter:title" content="Automatización de datos hídricos del IDEAM" />
    <meta name="twitter:description" content="Gráficas, mapas, curvas IDF y descargas sobre los datos abiertos del IDEAM." />
    <meta name="twitter:image" content="https://ideam.sergiobc.com/og-ideam.png" />
    <!-- Favicon: logo CUC (la "U") sobre azulejo rojo institucional #A3161A. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
    <script>
      // Anti-FOUC: aplica el tema antes del primer paint. Debe mantenerse en
      // sincronía con src/app/lib/theme.ts (misma clave 'ideam-theme' y los
      // tres valores 'light' | 'dark' | 'system').
      (function () {
        try {
          var choice = localStorage.getItem('ideam-theme') || 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = choice === 'dark' || (choice === 'system' && prefersDark);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <!-- Cloudflare Web Analytics (sin cookies, sin datos personales). Token
         público por diseño. SIN integrity: Cloudflare actualiza beacon.min.js
         y un hash SRI lo rompería (excepción intencional a la regla de SRI). -->
    <script defer src='https://static.cloudflareinsights.com/beacon.min.js'
            data-cf-beacon='{"token": "8836b6ec3b264eda9e4abafafb895110"}'></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
